<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="A beaver gnawing a database table">
  <!-- Database table cylinder -->
  <g stroke="#19201c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 15 L5 40 A13 5 0 0 0 31 40 L31 15" fill="#0d6b63"/>
    <ellipse cx="18" cy="15" rx="13" ry="5" fill="#2f9389"/>
    <path d="M5 24 A13 5 0 0 0 31 24" fill="none"/>
    <path d="M5 33 A13 5 0 0 0 31 33" fill="none"/>
  </g>

  <!-- Chewed crumbs flying off the table -->
  <g fill="#2f9389" stroke="#19201c" stroke-width="1">
    <circle cx="26" cy="46" r="1.6"/>
    <circle cx="22" cy="42" r="1.2"/>
    <circle cx="25" cy="51" r="1.1"/>
  </g>

  <!-- Beaver -->
  <g stroke="#19201c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- paddle tail -->
    <path d="M47 41 q13 0 13 11 q0 10 -13 8 z" fill="#6f3f0c"/>
    <!-- body -->
    <ellipse cx="44" cy="40" rx="15" ry="14" fill="#9c5a16"/>
    <!-- belly -->
    <ellipse cx="43" cy="44" rx="8" ry="9" fill="#c98a3f" stroke="none"/>
    <!-- front paw -->
    <ellipse cx="37" cy="52" rx="3.2" ry="2.3" fill="#c98a3f"/>
    <!-- ear -->
    <circle cx="42" cy="28" r="3.4" fill="#9c5a16"/>
    <!-- snout reaching the table -->
    <ellipse cx="33" cy="39" rx="4.2" ry="3.6" fill="#c98a3f"/>
    <!-- big front teeth gnawing the rim -->
    <path d="M28.4 40 h2.4 v4.4 a1.2 1.2 0 0 1 -2.4 0 z" fill="#fffdf5" stroke-width="1.3"/>
    <path d="M31 40 h2.4 v4.4 a1.2 1.2 0 0 1 -2.4 0 z" fill="#fffdf5" stroke-width="1.3"/>
  </g>

  <!-- tail texture -->
  <g stroke="#19201c" stroke-width="1" stroke-linecap="round">
    <path d="M50 44 l5 4"/>
    <path d="M49 49 l6 3"/>
    <path d="M50 54 l5 2"/>
  </g>

  <!-- inner ear, eye, nose -->
  <circle cx="42" cy="28" r="1.4" fill="#6f3f0c"/>
  <circle cx="38" cy="34" r="2" fill="#19201c"/>
  <circle cx="38.7" cy="33.3" r="0.6" fill="#fffefb"/>
  <ellipse cx="30" cy="38" rx="1.9" ry="1.5" fill="#19201c"/>
</svg>
