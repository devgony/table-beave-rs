<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="A beaver gnawing a data table">
  <!-- Data table icon (KEEP THIS, do not restyle the table itself) -->
  <rect x="4" y="13" width="29" height="38" rx="3.5" fill="#fffefb" stroke="#19201c" stroke-width="2.2"/>
  <path d="M4 16.5 A3.5 3.5 0 0 1 7.5 13 H29.5 A3.5 3.5 0 0 1 33 16.5 V22 H4 Z" fill="#0d6b63"/>
  <g stroke="#19201c" stroke-width="2" stroke-linecap="round">
    <path d="M4 22 H33"/>
    <path d="M18.5 13 V51"/>
    <path d="M4 31 H33"/>
    <path d="M4 41 H33"/>
  </g>

  <!-- bite notch on the table right edge -->
  <path d="M33 29 q-6.5 5 0 11 q5.5 -2 5.5 -5.5 q0 -3.5 -5.5 -5.5 Z" fill="#fffefb" stroke="#19201c" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- BEAVER -->
  <!-- paddle tail (behind body) -->
  <g>
    <ellipse cx="56" cy="42" rx="7.5" ry="10" fill="#6f3f0c" stroke="#19201c" stroke-width="2.2"/>
    <g stroke="#19201c" stroke-width="1.1" opacity="0.55" stroke-linecap="round">
      <path d="M51 35 L61 41"/>
      <path d="M50.5 40 L61.5 44"/>
      <path d="M51 45 L61 49"/>
      <path d="M55 33 L53 51"/>
      <path d="M58.5 34 L57.5 50"/>
    </g>
  </g>

  <!-- body -->
  <path d="M37 33 q-7 4 -7 11 q0 9 11 9 q11 0 11 -10 q0 -7 -6 -11 Z" fill="#9c5a16" stroke="#19201c" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- belly -->
  <ellipse cx="42" cy="45" rx="6.5" ry="6" fill="#c98a3f"/>
  <!-- little foot -->
  <ellipse cx="40" cy="52" rx="3" ry="2" fill="#c98a3f" stroke="#19201c" stroke-width="1.8"/>

  <!-- head -->
  <path d="M40 19 q-9 1 -9 11 q0 10 11 10 q11 0 11 -11 q0 -9 -9 -10 Z" fill="#9c5a16" stroke="#19201c" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- ears -->
  <circle cx="35" cy="20.5" r="3.2" fill="#9c5a16" stroke="#19201c" stroke-width="2.2"/>
  <circle cx="49" cy="20.5" r="3.2" fill="#9c5a16" stroke="#19201c" stroke-width="2.2"/>

  <!-- eyebrows -->
  <g stroke="#19201c" stroke-width="2" stroke-linecap="round">
    <path d="M36 22.8 q2.6 -1.8 5.2 -0.4"/>
    <path d="M44.6 22.4 q2.6 -1.3 5 0.5"/>
  </g>

  <!-- eyes (big, round, friendly) -->
  <circle cx="39" cy="27.5" r="3.3" fill="#fffefb" stroke="#19201c" stroke-width="1.6"/>
  <circle cx="47" cy="27" r="3.3" fill="#fffefb" stroke="#19201c" stroke-width="1.6"/>
  <circle cx="39.6" cy="28" r="1.9" fill="#19201c"/>
  <circle cx="47.6" cy="27.5" r="1.9" fill="#19201c"/>
  <circle cx="40.3" cy="27.3" r="0.7" fill="#fffefb"/>
  <circle cx="48.3" cy="26.8" r="0.7" fill="#fffefb"/>

  <!-- muzzle (lighter, lower face) -->
  <ellipse cx="41" cy="34.5" rx="6" ry="5" fill="#c98a3f"/>
  <!-- rosy cheek -->
  <circle cx="47.5" cy="34" r="2" fill="#e8927c" opacity="0.85"/>
  <!-- nose -->
  <ellipse cx="40.5" cy="32" rx="2" ry="1.5" fill="#19201c"/>
  <!-- smile around teeth -->
  <path d="M37.5 34 q3 2.5 6 0.4" stroke="#19201c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- teeth biting the table edge -->
  <rect x="32" y="34.5" width="3.6" height="7" rx="1.2" fill="#fffdf5" stroke="#19201c" stroke-width="1.5"/>
  <rect x="35.7" y="34.5" width="3.6" height="7" rx="1.2" fill="#fffdf5" stroke="#19201c" stroke-width="1.5"/>

  <!-- crumbs -->
  <circle cx="44" cy="49" r="1.6" fill="#0d6b63"/>
  <circle cx="38" cy="56" r="1.2" fill="#0d6b63"/>
  <circle cx="33" cy="46" r="1.3" fill="#0d6b63"/>
</svg>