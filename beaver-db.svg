<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="A beaver gnawing a data table">
  <!-- Data table icon -->
  <rect x="4" y="13" width="29" height="38" rx="3.5" fill="#fffefb" stroke="#19201c" stroke-width="2.2"/>
  <path d="M4 16.5 A3.5 3.5 0 0 1 7.5 13 H29.5 A3.5 3.5 0 0 1 33 16.5 V22 H4 Z" fill="#0d6b63"/>
  <g stroke="#19201c" stroke-width="2" stroke-linecap="round">
    <path d="M4 22 H33"/>
    <path d="M18.5 13 V51"/>
    <path d="M4 31 H33"/>
    <path d="M4 41 H33"/>
  </g>

  <!-- Bite notch chewed out of the right edge -->
  <path d="M33 27 A5 5 0 0 0 33 37 Z" fill="#fffefb"/>
  <path d="M33 27 A5 5 0 0 0 33 37" fill="none" stroke="#19201c" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Chewed crumbs -->
  <g fill="#0d6b63" stroke="#19201c" stroke-width="1">
    <circle cx="28" cy="28" r="1.5"/>
    <circle cx="24.5" cy="32" r="1.2"/>
    <circle cx="28.5" cy="37" r="1.1"/>
  </g>

  <!-- Beaver -->
  <g stroke="#19201c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- paddle tail -->
    <path d="M49 43 q12 0 12 10 q0 9 -12 8 z" fill="#6f3f0c"/>
    <!-- body -->
    <ellipse cx="47" cy="41" rx="14" ry="13" fill="#9c5a16"/>
    <!-- belly -->
    <ellipse cx="46" cy="45" rx="8" ry="8" fill="#c98a3f" stroke="none"/>
    <!-- front paw -->
    <ellipse cx="39" cy="52" rx="3.2" ry="2.3" fill="#c98a3f"/>
    <!-- ear -->
    <circle cx="45" cy="26" r="3.4" fill="#9c5a16"/>
    <!-- snout reaching the table -->
    <ellipse cx="35" cy="30" rx="4" ry="3.4" fill="#c98a3f"/>
    <!-- big front teeth biting the edge -->
    <path d="M30 31 h2.4 v4.4 a1.2 1.2 0 0 1 -2.4 0 z" fill="#fffdf5" stroke-width="1.3"/>
    <path d="M32.6 31 h2.4 v4.4 a1.2 1.2 0 0 1 -2.4 0 z" fill="#fffdf5" stroke-width="1.3"/>
  </g>

  <!-- tail texture -->
  <g stroke="#19201c" stroke-width="1" stroke-linecap="round">
    <path d="M52 46 l5 4"/>
    <path d="M51 51 l6 3"/>
    <path d="M52 56 l5 2"/>
  </g>

  <!-- inner ear, eye, nose -->
  <circle cx="45" cy="26" r="1.4" fill="#6f3f0c"/>
  <circle cx="41" cy="31" r="2" fill="#19201c"/>
  <circle cx="41.7" cy="30.3" r="0.6" fill="#fffefb"/>
  <ellipse cx="32" cy="29" rx="1.9" ry="1.5" fill="#19201c"/>
</svg>
