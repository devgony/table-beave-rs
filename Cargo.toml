[package]
name = "beave-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
web-sys = { version = "0.3", features = [
  "Clipboard",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Navigator",
  "Window",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
